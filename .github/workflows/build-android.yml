name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Android
        uses: actions/setup-android@v3
      
      - name: Install SDK components
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
          sdkmanager --version || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
      
      - name: Install npm deps
        run: cd note-app && npm ci
      
      - name: Sync Capacitor
        run: cd note-app && npx cap sync android
      
      - name: Build APK
        working-directory: note-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tail -50
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: note-app/android/app/build/outputs/apk/debug/app-debug.apk
